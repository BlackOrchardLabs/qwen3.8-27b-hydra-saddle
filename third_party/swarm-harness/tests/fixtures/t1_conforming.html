<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T1 Bounded Pen</title>
<style>
  body { margin: 0; background: #0b0e13; color: #dfe6ee; font: 14px/1.4 monospace; }
  .bar { padding: 10px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  button { background: #1d2430; color: #dfe6ee; border: 1px solid #3a4658; padding: 6px 14px; cursor: pointer; font: inherit; }
  button:hover { background: #2a3342; }
  #state, #seed { padding: 4px 10px; border: 1px solid #3a4658; background: #12161d; min-width: 90px; text-align: center; }
  #field { display: block; background: #05070a; border: 1px solid #263040; }
  .val { color: #7fd6a1; }
</style>
</head>
<body>
<div class="bar">
  <button id="pause">pause</button>
  <button id="reset">reset</button>
  <span id="state">running</span>
  <span id="seed">seed=0x5EED1234</span>
</div>
<canvas id="field" width="960" height="540"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var W = 960, H = 540;
  var seed = 0x5EED1234; // visible fixed seed
  var particle_count = 120;
  var particles = [];
  var pointer = { x: W / 2, y: H / 2, active: false };
  var running = true;

  // Deterministic PRNG (mulberry32) seeded from the fixed seed.
  function makeRng(s) {
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function init() {
    var rng = makeRng(seed);
    particles.length = 0;
    for (var i = 0; i < particle_count; i++) {
      particles.push({
        x: rng() * W,
        y: rng() * H,
        vx: (rng() - 0.5) * 2.0,
        vy: (rng() - 0.5) * 2.0,
        r: 2.5
      });
    }
  }

  function step() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (pointer.active) {
        var dx = pointer.x - p.x;
        var dy = pointer.y - p.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var pull = 0.05;
        p.vx += (dx / d) * pull;
        p.vy += (dy / d) * pull;
      }
      // mild damping keeps the pen bounded
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      // bounded: wrap at edges
      if (p.x < 0) p.x += W; else if (p.x >= W) p.x -= W;
      if (p.y < 0) p.y += H; else if (p.y >= H) p.y -= H;
    }
  }

  function draw() {
    ctx.fillStyle = "#05070a";
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "#59d3a8";
      ctx.fill();
    }
  }

  function loop() {
    if (running) step();
    draw();
    requestAnimationFrame(loop);
  }

  // Pointer attraction (pointermove keeps pointer.active true)
  function updatePointer(e) {
    var rect = canvas.getBoundingClientRect();
    pointer.x = (e.clientX - rect.left) * (W / rect.width);
    pointer.y = (e.clientY - rect.top) * (H / rect.height);
    pointer.active = true;
  }
  canvas.addEventListener("pointermove", updatePointer);
  canvas.addEventListener("pointerdown", updatePointer);
  canvas.addEventListener("pointerleave", function () { pointer.active = false; });
  canvas.addEventListener("mousemove", updatePointer);

  var stateEl = document.getElementById("state");
  var pauseBtn = document.getElementById("pause");
  var resetBtn = document.getElementById("reset");

  pauseBtn.addEventListener("click", function () {
    running = !running;
    stateEl.textContent = running ? "running" : "paused";
    pauseBtn.textContent = running ? "pause" : "resume";
  });

  resetBtn.addEventListener("click", function () {
    init(); // restores the same deterministic initial state
  });

  document.getElementById("seed").textContent = "seed=0x" + seed.toString(16).toUpperCase();

  init();
  loop();
})();
</script>
</body>
</html>
