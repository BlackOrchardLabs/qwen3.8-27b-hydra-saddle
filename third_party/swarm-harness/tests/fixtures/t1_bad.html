<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swarm Harness Door A</title>
</head>
<body>
<canvas id="field" width="960" height="540"></canvas>
<div>
  <span id="state">running</span>
  <span id="seed">1337</span>
  <button id="pause">pause</button>
  <button id="reset">reset</button>
</div>
<script>
(function() {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const stateEl = document.getElementById('state');
  const seedEl = document.getElementById('seed');
  const pauseBtn = document.getElementById('pause');
  const resetBtn = document.getElementById('reset');

  const SEED = 1337;
  seedEl.textContent = String(SEED);

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }

  const N = 120;
  let particles = [];
  let running = true;
  let pointer = { x: null, y: null, active: false };

  function initParticles() {
    const rng = mulberry32(SEED);
    particles = [];
    for (let i = 0; i < N; i++) {
      const x = rng() * canvas.width;
      const y = rng() * canvas.height;
      const angle = rng() * Math.PI * 2;
      const speed = 0.5 + rng() * 1.5;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed
      });
    }
  }

  function update() {
    for (let i = 0; i < N; i++) {
      const p = particles[i];
      if (pointer.active) {
        const dx = pointer.x - p.x;
        const dy = pointer.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const force = 0.02;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0) { p.x = 0; p.vx *= -1; }
      if (p.x > canvas.width) { p.x = canvas.width; p.vx *= -1; }
      if (p.y < 0) { p.y = 0; p.vy *= -1; }
      if (p.y > canvas.height) { p.y = canvas.height; p.vy *= -1; }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0ff';
    for (let i = 0; i < N; i++) {
      const p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop() {
    if (running) {
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.active = true;
  });

  canvas.addEventListener('pointerleave', () => {
    pointer.active = false;
  });

  pauseBtn.addEventListener('click', () => {
    running = !running;
    stateEl.textContent = running ? 'running' : 'paused';
  });

  resetBtn.addEventListener('click', () => {
    initParticles();
    running = true;
    stateEl.textContent = 'running';
  });

  initParticles();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
